# Profil → Siparişlerim → ilk sipariş kartını aç.
# Pre-req: kullanıcı login + en az bir sipariş seed'li.
appId: host.exp.Exponent
---
- tapOn:
    text: "Profil"
- extendedWaitUntil:
    visible:
      id: "profile-orders-link"
    timeout: 15000
- tapOn:
    id: "profile-orders-link"
- waitForAnimationToEnd
# İlk sipariş kartı: Sipariş # ile başlayan ilk eleman.
- extendedWaitUntil:
    visible:
      text: ".*Sipariş.*"
    timeout: 30000
- tapOn:
    text: ".*Sipariş.*"
    index: 0
- extendedWaitUntil:
    visible: "Sipariş Detayı"
    timeout: 15000
