# Login subflow: Profil tab'da "Giriş Yap" butonu görünür durumdayken çağrılır.
appId: host.exp.Exponent
---
- tapOn: "Giriş Yap"
- extendedWaitUntil:
    visible: "E-posta"
    timeout: 15000
- tapOn:
    text: "E-posta"
- inputText: ${EMAIL}
- tapOn:
    text: "Şifre"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Giriş Yap"
- extendedWaitUntil:
    visible: "Ana Sayfa"
    timeout: 30000
