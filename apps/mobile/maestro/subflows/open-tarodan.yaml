# Expo Go'yu launch et ve Tarodan'ı aç. Tarodan zaten açıksa direkt geçer.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
    clearState: false
# Recents'tan Tarodan'a tıkla (Tarodan zaten açıksa bu element olmaz, optional ile atlanır).
- tapOn:
    text: "Tarodan"
    index: 0
    optional: true
# Tarodan tab bar görünene kadar bekle.
- extendedWaitUntil:
    visible:
      text: "Ana Sayfa, tab.*"
    timeout: 90000
