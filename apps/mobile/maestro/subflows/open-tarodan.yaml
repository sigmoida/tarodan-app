appId: com.tarodan.app
---
- launchApp:
    appId: com.tarodan.app
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Açılsın mı"
    commands:
      - tapOn: "Aç"
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: "http://localhost"
          optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Go home"
    optional: true
# Login UI is bypassed by EXPO_PUBLIC_MAESTRO=1 auto-login (see authStore.loadToken).
# App boots → loadToken sees no SecureStore token → calls /auth/login with
# zeynep@demo.com (override via EXPO_PUBLIC_MAESTRO_EMAIL/PASSWORD) → home renders.
- tapOn:
    text: "Şimdi Değil"
    optional: true
# Auto-login + bundle reload + home full render zinciri 40-50s sürebilir; 120s
# güvenli payda.
- extendedWaitUntil:
    visible:
      text: "Ana Sayfa"
    timeout: 120000
