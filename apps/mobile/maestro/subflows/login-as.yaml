# Login as zeynep@demo.com (default test user). Hard-coded — Maestro 2.5'te
# runFlow.env inputText'e propagate olmuyor. Başka kullanıcı için ayrı subflow yaz.
# Login zaten yapılmışsa (profile-go-login-button görünmüyorsa) komutlar atlanır.
appId: com.tarodan.app
---
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
      - extendedWaitUntil:
          visible:
            id: "login-email-input"
          timeout: 15000
      - tapOn:
          id: "login-email-input"
      - inputText: "zeynep@demo.com"
      - tapOn:
          id: "login-password-input"
      - inputText: "Demo123!"
      - tapOn:
          id: "login-submit-button"
      - extendedWaitUntil:
          visible:
            text: "Ana Sayfa"
          timeout: 30000
      # iOS keychain "Parolayı Kaydet" sheet — login sonrası gelir, Profil tap'ini bloker.
      - runFlow:
          when:
            visible: "Şimdi Değil"
          commands:
            - tapOn: "Şimdi Değil"
