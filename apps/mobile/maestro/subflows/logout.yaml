# Logout subflow: Profil ekranı açık + login yapılmış olmalı.
# Logout sonrası uygulama login ekranına yönlendirir (router.push /(auth)/login).
appId: com.tarodan.app
---
- scrollUntilVisible:
    element:
      id: "profile-logout-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "profile-logout-button"
- runFlow:
    when:
      visible: "Onayla"
    commands:
      - tapOn: "Onayla"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
# Post-logout state guard: login form gerçekten render olmuş, "Giriş Yap"
# butonu görünür. Aksi takdirde sonraki subflow'lar SKIPPED yerine FAILED
# dönebilir.
- assertVisible: "Giriş Yap"
