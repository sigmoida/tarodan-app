# Logout subflow: Profil ekranı açık + login yapılmış olmalı.
# Logout sonrası uygulama login ekranına yönlendirir (router.push /(auth)/login).
appId: host.exp.Exponent
---
- scrollUntilVisible:
    element:
      id: "profile-logout-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "profile-logout-button"
- runFlow:
    when:
      visible: "Onayla"
    commands:
      - tapOn: "Onayla"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 10000
