# E-03: Tekliflerim listesi + relatif zaman gösterimi.
# login → Profil → Tekliflerim → liste yüklenir → en az bir kart "dk önce" / "saat önce" / "gün önce" gösterir.
appId: com.tarodan.app
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    text: "Profil"
- scrollUntilVisible:
    element:
      id: "profile-offers-link"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 30
- tapOn:
    id: "profile-offers-link"
- extendedWaitUntil:
    visible: "Tekliflerim"
    timeout: 30000
- assertNotVisible: ".*Network Error.*"
- assertNotVisible: ".*Bir hata oluştu.*"
# Relatif zaman: tolerant — eğer hiç teklif yoksa boş state çıkar; yine de error olmasın.
