# F-20: Manual flow. Pre-condition: zeynep'in shipping_to_warehouse durumunda
# bir takası DB'de olmalı (manuel SQL ile fixture).
# Akış: takas detay → inbound card görünür → status chip "Etiket Hazır"
# → (kullanıcı manuel olarak `psql -c "UPDATE trade_shipments SET status='in_transit' WHERE ..."`)
# → pull-to-refresh → chip "Yolda"
appId: com.tarodan.app
tags:
  - manual
---
- runFlow: ../subflows/open-tarodan.yaml
- runFlow: ../subflows/open-first-trade.yaml
- assertVisible:
    id: "trade-inbound-card"
- assertVisible:
    id: "trade-status-chip-my-inbound"
# Kullanıcı manuel DB update'i yapacak (Maestro burada PAUSE eder).
# Sonrasında pull-to-refresh ile UI yenilenir.
- swipe:
    start: 50%, 30%
    end: 50%, 80%
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "trade-status-chip-my-inbound"
