# F-16: Language toggle — TR → EN → assert strings changed → TR back.
appId: com.tarodan.app
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    text: "Profil"
- assertVisible: "Profil"
- scrollUntilVisible:
    element:
      text: "Ayarlar|Dil"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Dil|Ayarlar"
- extendedWaitUntil:
    visible:
      text: "Dil|Language"
    timeout: 15000
# Dil seçim ekranında EN'e geç
- tapOn:
    text: "English|İngilizce|EN"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- back
- tapOn:
    text: "Profile|Profil"
- extendedWaitUntil:
    visible:
      text: "Profile|Settings"
    timeout: 15000
- assertVisible:
    text: "Profile|Settings"
# Geri TR'ye al (clean state)
- tapOn:
    text: "Settings|Ayarlar"
    optional: true
- tapOn:
    text: "Language|Dil"
    optional: true
- tapOn:
    text: "Türkçe|TR"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: ".*Network Error.*"
