# F-07: Category drill-down — Home → Kategoriler → category → product.
# Ana sayfada Kategoriler bölümü ya da kategori chip'i bekleniyor.
appId: host.exp.Exponent
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- tapOn:
    text: "Ana Sayfa"
- extendedWaitUntil:
    visible:
      text: "Kategoriler|Tüm Kategoriler"
    timeout: 30000
- tapOn:
    text: "Kategoriler|Tüm Kategoriler"
# Kategori listesi/grid render edilir; ilk kategori kartına tıkla.
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
# Kategori sayfası açıldı; ilk fiyatlı ürüne tıkla.
- tapOn:
    text: ".*₺.*"
    index: 0
    optional: true
- extendedWaitUntil:
    visible:
      text: "Sepete Ekle|Teklif Ver|Açıklama"
    timeout: 30000
- assertNotVisible: ".*Bir hata oluştu.*"
# Geri nav: kategoriden ana sayfaya dön
- back
- back
- extendedWaitUntil:
    visible: "Ana Sayfa"
    timeout: 15000
