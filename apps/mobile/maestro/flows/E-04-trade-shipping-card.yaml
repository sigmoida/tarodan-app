# E-04: Takas — shipping_to_warehouse durumunda Sürat otomatik kargo kartı görünür.
# login → Trades → shipping_to_warehouse statüsündeki bir takas → kart + TRD- tracking num.
#
# Pre-req: Zeynep'te `shipping_to_warehouse` statüsünde aktif bir takas seed'li olmalı.
# Eğer yoksa kart render olmaz → flow fail eder. Manual tag, fixture'a bağlı.
appId: com.tarodan.app
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- runFlow: ../subflows/open-first-trade.yaml
# Bir shipping_to_warehouse takasını aç — listede ilk eleman bu duruma denk gelmeyebilir,
# fixture'a göre direkt URI'a gitmek gerekirse env'e TRADE_ID eklenip openLink kullanılabilir.
- tapOn:
    text: ".*Depoya.*|.*shipping.*"
    optional: true
- extendedWaitUntil:
    visible: "Tarodan Deposuna Gönderim"
    timeout: 30000
- assertVisible: "Sizin gönderiniz"
- assertVisible:
    text: "TRD-.*"
- assertNotVisible: ".*Network Error.*"
