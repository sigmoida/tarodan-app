# F-05: Tab navigation comprehensive — login → her bottom tab.
# Sell/Ekle tab i18n key fallback nedeniyle özel: tab order ile gez.
appId: host.exp.Exponent
tags:
  - smoke
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
# 1. Ana Sayfa
- tapOn:
    text: "Ana Sayfa"
- extendedWaitUntil:
    visible:
      text: "Ana Sayfa"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
# 2. Ara
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- assertVisible:
    id: "search-input"
- assertNotVisible: ".*Network Error.*"
# 3. Mesajlar
- tapOn:
    text: "Mesajlar"
- extendedWaitUntil:
    visible:
      text: "Mesajlar"
    timeout: 15000
- assertNotVisible: ".*Network Error.*"
# 4. Profil
- tapOn:
    text: "Profil"
- extendedWaitUntil:
    visible: "zeynep@demo.com"
    timeout: 15000
- assertVisible: "zeynep@demo.com"
- assertNotVisible: ".*Bir hata oluştu.*"
# Geri Ana Sayfa'ya dön (clean state)
- tapOn:
    text: "Ana Sayfa"
- assertVisible: "Ana Sayfa"
