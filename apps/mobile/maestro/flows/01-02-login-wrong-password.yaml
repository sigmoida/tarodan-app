# 01-02: Yanlış şifre → login error banner görünür, ana sayfaya geçilmez.
appId: host.exp.Exponent
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- tapOn:
    id: "login-email-input"
- inputText: "zeynep@demo.com"
- tapOn:
    id: "login-password-input"
- inputText: "yanlis-sifre"
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible:
      id: "login-error-banner"
    timeout: 15000
- assertVisible:
    id: "login-error-banner"
- assertNotVisible: "Kategoriler"
