# F-12: Stockout redirect — açılınca /products/unavailable/{id}'ye yönlendirilir.
# E-01 unavailable hero ile paralel; E-08 push deeplink ile paralel.
# Bu flow direct deeplink ile gidip hero + CTA görünürlüğünü doğrular.
appId: com.tarodan.app
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  STOCKOUT_PRODUCT_ID: "00000000-0000-0000-0000-000000000000"
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
- openLink: "tarodan://products/unavailable/${STOCKOUT_PRODUCT_ID}"
- extendedWaitUntil:
    visible:
      id: "unavailable-hero-title"
    timeout: 30000
- assertVisible:
    id: "unavailable-hero-title"
- assertVisible:
    text: ".*stokta yok.*|.*tekrar sat.*"
- assertVisible:
    text: ".*kategori.*|Benzer ürünler"
- assertNotVisible: ".*Network Error.*"
