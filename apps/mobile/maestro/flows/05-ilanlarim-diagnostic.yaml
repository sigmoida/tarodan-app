# "İlanlarım açılmıyor" bug'ını yakalamak için tasarlanmış diagnostic flow.
# Kullanıcı premium hesapla giriş yapmış olmalı (Zeynep'in 6 ilanı var seed'de).
# Beklenen: Profile → İlanlarım tıkla → İlanlarım listesinde en az 1 ilan görünür.
appId: host.exp.Exponent
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil, tab.*"
- extendedWaitUntil:
    visible:
      text: ".*İlanlarım.*"
    timeout: 10000
- tapOn:
    text: ".*İlanlarım.*"
    index: 0
# Beklenti: ilanlar listesi açılır. "İlan", "ilan ekle", veya bir ürün başlığı görünmeli.
- extendedWaitUntil:
    visible:
      text: ".*İlan.*"
    timeout: 15000
# Boş veya hatalı durumların regresyonu için:
- assertNotVisible:
    text: ".*Bir hata oluştu.*"
- assertNotVisible:
    text: ".*Network Error.*"
