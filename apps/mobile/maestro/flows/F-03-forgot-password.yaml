# F-03: Forgot password mail dispatch — login → Şifremi Unuttum → email → success.
appId: host.exp.Exponent
tags:
  - regression
env:
  EMAIL: zeynep@demo.com
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 15000
- tapOn:
    text: "Şifremi Unuttum|Şifremi unuttum"
- extendedWaitUntil:
    visible:
      id: "forgot-email-input"
    timeout: 15000
- tapOn:
    id: "forgot-email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "forgot-submit-button"
- extendedWaitUntil:
    visible:
      text: ".*Email Gönderildi.*|.*sıfırlama linki.*|.*gönderildi.*"
    timeout: 20000
- assertVisible:
    text: ".*gönderildi.*|.*Email Gönderildi.*"
- assertNotVisible: ".*Network Error.*"
