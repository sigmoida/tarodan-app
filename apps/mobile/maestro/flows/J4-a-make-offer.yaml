# Yolculuk 4 — Segment A: alıcı (zeynep, auto-login) ürüne ilk teklifini verir.
# Buyer auto-login (EXPO_PUBLIC_MAESTRO=1, NO_AUTOLOGIN YOK). Ürün: ilk "diecast"
# sonucu (zeynep'in olmayan, Mehmet'in F-14'ü ~349₺). Teklif 200₺ (>%50, <fiyat).
# Önce orkestratör driver reset-offers ile zeynep'in açık tekliflerini temizler.
appId: com.tarodan.app
tags:
  - manual
---
# clearState YOK — dev-client launcher + "developer menu" intro'su clearState ile
# geliyor. clearState'siz boot → auto-login (token yoksa zeynep). Garantili zeynep
# için: girişliyse çıkış yap, sonra UI'dan zeynep login.
- launchApp:
    appId: com.tarodan.app
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Ana Sayfa"
    timeout: 120000
# Profil → girişliyse çıkış yap (stale token başka kullanıcı olabilir). Hem logout
# hem unauthenticated yolu login ekranına (login-email-input) yakınsar.
- tapOn:
    text: "Profil"
# Girişliyse (go-login butonu YOKSA) çıkış yap — stale token ahmet olabilir.
# logout.yaml scrollUntilVisible ile logout butonunu bulur ("Çıkış Yap" metni
# scroll gerektirdiğinden metin-guard güvenilmezdi).
- runFlow:
    when:
      notVisible:
        id: "profile-go-login-button"
    file: ../subflows/logout.yaml
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
      - extendedWaitUntil:
          visible:
            id: "login-email-input"
          timeout: 15000
# Login ekranındaysak (logout sonrası ya da unauthenticated) → zeynep login.
- runFlow:
    when:
      visible:
        id: "login-email-input"
    commands:
      - tapOn:
          id: "login-email-input"
      - inputText: "zeynep@demo.com"
      - tapOn:
          id: "login-password-input"
      - inputText: "Demo123!"
      - tapOn:
          id: "login-submit-button"
      - extendedWaitUntil:
          visible: "Ana Sayfa"
          timeout: 60000
      - tapOn:
          text: "Şimdi Değil"
          optional: true
# Ana sayfaya dön + Kategoriler doğrula.
- tapOn:
    text: "Ana Sayfa"
    optional: true
- extendedWaitUntil:
    visible: "Kategoriler"
    timeout: 30000
# Arama → ürün detay (Journey 1 deseni: hideKeyboard + kart testID)
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "diecast"
- waitForAnimationToEnd:
    timeout: 5000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "search-result-card"
    timeout: 15000
- tapOn:
    id: "search-result-card"
    index: 0
# Ürün detayı açıldı → "Teklif Ver" (ikon+label, accessibility tam-eşleşmez → regex)
- extendedWaitUntil:
    visible:
      text: ".*Teklif Ver.*"
    timeout: 15000
- tapOn:
    text: ".*Teklif Ver.*"
# Teklif modalı. RNModal içeriği selektörle zor; gerçek metinle doğrula + input'a
# koordinatla dokun (tutar alanı modalın üst-ortası), submit'i metinle.
- extendedWaitUntil:
    visible:
      text: ".*Liste fiyatı.*"
    timeout: 15000
- tapOn:
    point: "50%,48%"
- inputText: "200"
# QWERTY return tuşu → Enter input'u blur eder (single-line blurOnSubmit), klavye kapanır.
# (hideKeyboard modal içinde başarısız oluyor.)
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
# RNModal'da text-tap onPress'i tetiklemiyor; koordinat tap çalışıyor (input öyle doldu).
# "Teklif Gönder" sağ-alt köşede.
- tapOn:
    point: "78%,74%"
# Başarı: "Teklifiniz gönderildi"
- extendedWaitUntil:
    visible:
      text: ".*gönderildi.*"
    timeout: 20000
- assertVisible:
    text: ".*gönderildi.*"
