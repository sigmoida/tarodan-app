# E-01: Stockout dedicated page — login → /products/unavailable/{id} via deep link →
# "Bu ürün artık stokta yok" header + "Benzer ürünler" section.
#
# Not: Direkt deep link ile gidiyoruz çünkü "satılmış ürün" listede stabil değil.
# Expo Go scheme: exp+tarodan:// (cihazda Expo Go açıkken Tarodan)
# Bu flow, stockout fixture seed'ine bağımlıdır → gerçek bir productId gerek.
# Eğer fixture yoksa Network/yükleme hatası olmaz, ama hero başlığı çıkmayabilir →
# tags: [manual] altında işaretledik.
appId: com.tarodan.app
tags:
  - manual
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
  STOCKOUT_PRODUCT_ID: "00000000-0000-0000-0000-000000000000"
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible: "Çıkış Yap"
    file: ../subflows/logout.yaml
- runFlow: ../subflows/login-as.yaml
# Deep link to unavailable page
- openLink: "tarodan://products/unavailable/${STOCKOUT_PRODUCT_ID}"
- extendedWaitUntil:
    visible:
      id: "unavailable-hero-title"
    timeout: 30000
- assertVisible:
    text: ".*stokta yok.*|.*tekrar sat.*"
- assertVisible: "Benzer ürünler"
- assertNotVisible: ".*Network Error.*"
