# F-24: Manual. Pre-condition: zeynep'in delivered durumda bir order'ı
# (14 gün içinde). Akış: detay → İade Talep Et → modal → Hasarlı geldi →
# Submit → "İade Sürüyor" banner. Sonra DB'de RefundRequest.status →
# 'return_shipment_open' + returnTrackingNumber set. Pull-to-refresh →
# RFD-tracking görünür.
appId: com.tarodan.app
tags:
  - manual
---
- runFlow: ../subflows/open-tarodan.yaml
- runFlow: ../subflows/open-first-order.yaml
- extendedWaitUntil:
    visible:
      id: "refund-request-button"
    timeout: 15000
- tapOn:
    id: "refund-request-button"
- tapOn:
    text: "Hasarlı geldi"
- tapOn:
    text: "İade Talebi Gönder|Gönder"
- extendedWaitUntil:
    visible:
      id: "refund-active-banner"
    timeout: 15000
# Kullanıcı manuel olarak DB update'i yapar (RefundRequest.status='return_shipment_open' + returnTrackingNumber)
# Pull-to-refresh
- swipe:
    start: 50%, 30%
    end: 50%, 80%
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "RFD-"
