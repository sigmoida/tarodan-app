# F-23: Bypass mode'da uçtan uca: ürün → Sepete Ekle → cart → checkout →
# Devam Et → Ödemeyi Tamamla → bypass-complete → /payment/success.
#
# NOT (BUG-007 düzeltmesi): App sepet-tabanlı; eski "Hemen Al"/product-detail-buy-button
# yok. Doğru zincir: product-detail-add-to-cart-button → Sepete Git →
# cart-checkout-button → checkout (Teslimat → Devam Et → Ödeme → Ödemeyi Tamamla).
# Pre-req: PAYMENT_BYPASS=true + zeynep'te kayıtlı teslimat adresi.
appId: com.tarodan.app
tags:
  - smoke
env:
  EMAIL: zeynep@demo.com
  PASSWORD: Demo123!
---
- runFlow: ../subflows/open-tarodan.yaml
# Ara → ilk ürün
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "diecast"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: ".*₺.*"
    index: 0
# Ürün detay → Sepete Ekle → Sepete Git
- extendedWaitUntil:
    visible:
      id: "product-detail-add-to-cart-button"
    timeout: 15000
- tapOn:
    id: "product-detail-add-to-cart-button"
- tapOn:
    text: "Sepete Git"
    optional: true
# Cart → Satın Al → checkout
- extendedWaitUntil:
    visible:
      id: "cart-checkout-button"
    timeout: 15000
- tapOn:
    id: "cart-checkout-button"
# Checkout Step 1 (Teslimat) → Devam Et
- extendedWaitUntil:
    visible: "Teslimat Bilgileri"
    timeout: 20000
- tapOn:
    text: "Devam Et.*"
# Checkout Step 2 (Ödeme) → Ödemeyi Tamamla (bypass → success)
- extendedWaitUntil:
    visible:
      text: ".*Ödeme.*Tamamla.*|.*Ödemeyi.*"
    timeout: 20000
- tapOn:
    text: ".*Ödeme.*Tamamla.*|.*Ödemeyi.*"
- extendedWaitUntil:
    visible:
      text: ".*başarı.*|Sipariş.*tamamland.*|Tamamlandı"
    timeout: 30000
# Profil → Siparişlerim → yeni sipariş görünür
- tapOn:
    text: "Profil"
- tapOn:
    id: "profile-orders-link"
- assertVisible: "ORD-"
