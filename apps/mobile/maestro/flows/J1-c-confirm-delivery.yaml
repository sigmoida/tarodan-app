# Yolculuk 1 — Segment C: alıcı Siparişlerim'de "Teslim Aldım" ile teslimatı
# onaylar → backend order completed + hold release. Ardından sipariş tamamlandı
# durumu UI'da doğrulanır.
# Ön koşul (orkestrator): REG_EMAIL ile giriş yapılmış olabilir; değilse login.
# Sipariş driver tarafından 'delivered' duruma getirilmiş olmalı.
appId: com.tarodan.app
tags:
  - manual
# REG_EMAIL / REG_PASSWORD orkestratörden --env ile gelir (inline env --env'i ezer).
---
- launchApp:
    appId: com.tarodan.app
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Continue"
    optional: true
# Expo geliştirici menüsü açılırsa kapat (backdrop, sonra X).
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "91%,47%"
      - waitForAnimationToEnd:
          timeout: 2000
# Giriş garanti (oturum düşmüşse)
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
      - extendedWaitUntil:
          visible:
            id: "login-email-input"
          timeout: 15000
      - tapOn:
          id: "login-email-input"
      - inputText: "${REG_EMAIL}"
      - tapOn:
          id: "login-password-input"
      - inputText: "${REG_PASSWORD}"
      - tapOn:
          id: "login-submit-button"
      - extendedWaitUntil:
          visible:
            text: "Ana Sayfa"
          timeout: 60000
      - tapOn:
          text: "Şimdi Değil"
          optional: true
# 9. Siparişlerim → Teslim Aldım
- tapOn:
    text: "Profil"
- extendedWaitUntil:
    visible:
      id: "profile-orders-link"
    timeout: 15000
- tapOn:
    id: "profile-orders-link"
# Buton ikon içerdiği için accessibility metni "Teslim Aldım" tam eşleşmiyor → regex.
- extendedWaitUntil:
    visible:
      text: ".*Teslim Aldım.*"
    timeout: 20000
- tapOn:
    text: ".*Teslim Aldım.*"
- runFlow:
    when:
      visible: ".*Onayla.*"
    commands:
      - tapOn:
          text: ".*Onayla.*"
# Son: sipariş durumu tamamlandı/onaylandı görünür
- extendedWaitUntil:
    visible:
      text: ".*Tamamland.*|.*Onaylan.*"
    timeout: 20000
- assertVisible:
    text: ".*Tamamland.*|.*Onaylan.*"
