# Yolculuk 1 — Segment B: yeni kullanıcı ile giriş → arama → sepete ekle →
# checkout (seed'li adres) → bypass ödeme → sipariş oluştu.
# Ön koşul (orkestrator garanti eder): REG_EMAIL kayıtlı + email verified +
# default adres seed'li + PAYMENT_BYPASS=true.
appId: com.tarodan.app
tags:
  - manual
# REG_EMAIL / REG_PASSWORD orkestratörden --env ile gelir (inline env --env'i ezer).
---
- launchApp:
    appId: com.tarodan.app
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Continue"
    optional: true
# Expo geliştirici menüsü açılırsa kapat (backdrop, sonra X).
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "91%,47%"
      - waitForAnimationToEnd:
          timeout: 2000
# Giriş: Profil → Giriş Yap → REG_EMAIL
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
      - extendedWaitUntil:
          visible:
            id: "login-email-input"
          timeout: 15000
      - tapOn:
          id: "login-email-input"
      - inputText: "${REG_EMAIL}"
      - tapOn:
          id: "login-password-input"
      - inputText: "${REG_PASSWORD}"
      - tapOn:
          id: "login-submit-button"
      - extendedWaitUntil:
          visible:
            text: "Ana Sayfa"
          timeout: 60000
      - tapOn:
          text: "Şimdi Değil"
          optional: true
# 4. Sepete ekle
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "diecast"
- waitForAnimationToEnd:
    timeout: 5000
# Klavyeyi kapat — açık klavyede listenin ilk tap'i karta değil klavye kapatmaya gider.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "search-result-card"
    timeout: 15000
- tapOn:
    id: "search-result-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-detail-add-to-cart-button"
    timeout: 15000
- tapOn:
    id: "product-detail-add-to-cart-button"
- tapOn:
    text: "Sepete Git"
    optional: true
# 4b. Sepet özeti: toplam görünür
- extendedWaitUntil:
    visible:
      id: "cart-checkout-button"
    timeout: 15000
- assertVisible:
    text: ".*Toplam.*"
# 5. Checkout → Teslimat (seed'li adres) → Devam Et
- tapOn:
    id: "cart-checkout-button"
- extendedWaitUntil:
    visible: "Teslimat Bilgileri"
    timeout: 20000
- tapOn:
    text: "Devam Et.*"
# 6. Ödeme → bypass → başarı
- extendedWaitUntil:
    visible:
      text: ".*Ödeme.*Tamamla.*|.*Ödemeyi.*"
    timeout: 20000
- tapOn:
    text: ".*Ödeme.*Tamamla.*|.*Ödemeyi.*"
- extendedWaitUntil:
    visible:
      text: ".*başarı.*|Sipariş.*tamamland.*|Tamamlandı"
    timeout: 30000
# Sipariş oluştu doğrulama: Siparişlerim'de ORD-
- tapOn:
    text: "Profil"
- tapOn:
    id: "profile-orders-link"
- extendedWaitUntil:
    visible: "ORD-"
    timeout: 20000
- assertVisible: "ORD-"
