# Yolculuk 1 — Segment B: yeni kullanıcı ile giriş → arama → sepete ekle →
# checkout (seed'li adres) → bypass ödeme → sipariş oluştu.
# Ön koşul (orkestrator garanti eder): REG_EMAIL kayıtlı + email verified +
# default adres seed'li + PAYMENT_BYPASS=true.
appId: com.tarodan.app
tags:
  - manual
# REG_EMAIL / REG_PASSWORD orkestratörden --env ile gelir (inline env --env'i ezer).
---
- launchApp:
    appId: com.tarodan.app
    clearState: false
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Continue"
    optional: true
# Expo geliştirici menüsü açılırsa kapat (backdrop, sonra X).
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "50%,10%"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "91%,47%"
      - waitForAnimationToEnd:
          timeout: 2000
# Giriş: Profil → Giriş Yap → REG_EMAIL
- tapOn:
    text: "Profil"
- runFlow:
    when:
      visible:
        id: "profile-go-login-button"
    commands:
      - tapOn:
          id: "profile-go-login-button"
      - extendedWaitUntil:
          visible:
            id: "login-email-input"
          timeout: 15000
      - tapOn:
          id: "login-email-input"
      - inputText: "${REG_EMAIL}"
      - tapOn:
          id: "login-password-input"
      - inputText: "${REG_PASSWORD}"
      - tapOn:
          id: "login-submit-button"
      - extendedWaitUntil:
          visible:
            text: "Ana Sayfa"
          timeout: 60000
      - tapOn:
          text: "Şimdi Değil"
          optional: true
# 4. Sepete ekle
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "diecast"
- waitForAnimationToEnd:
    timeout: 5000
# Klavyeyi kapat — açık klavyede listenin ilk tap'i karta değil klavye kapatmaya gider.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "search-result-card"
    timeout: 15000
- tapOn:
    id: "search-result-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "product-detail-add-to-cart-button"
    timeout: 15000
- tapOn:
    id: "product-detail-add-to-cart-button"
- tapOn:
    text: "Sepete Git"
    optional: true
# 4b. Sepet özeti: toplam görünür
- extendedWaitUntil:
    visible:
      id: "cart-checkout-button"
    timeout: 15000
- assertVisible:
    text: ".*Toplam.*"
# 5. Checkout 3 adım: Adres → Ödeme → Onay.
- tapOn:
    id: "cart-checkout-button"
# Adım 1 (Teslimat/Adres): seed'li default adres seçili → Devam Et
- extendedWaitUntil:
    visible: "Teslimat Bilgileri"
    timeout: 20000
- tapOn:
    text: "Devam Et.*"
# Adım 2 (Ödeme: kargo + ödeme yöntemi) → Devam Et
- extendedWaitUntil:
    visible: "Ödeme Yöntemi"
    timeout: 20000
- tapOn:
    text: "Devam Et.*"
# Adım 3 (Onay): "Onayla ve Öde (₺X)" → bypass ödeme → başarı
- extendedWaitUntil:
    visible:
      text: ".*Onayla ve Öde.*"
    timeout: 20000
- tapOn:
    text: ".*Onayla ve Öde.*"
# Başarı ekranı: "Ödemeniz Başarılı!" → sipariş oluştu (driver assert-invoice doğrular).
- extendedWaitUntil:
    visible:
      text: ".*Başarılı.*|.*başarı.*|Sipariş.*tamamland.*|Tamamlandı"
    timeout: 40000
- assertVisible:
    text: ".*Başarılı.*|.*tamamland.*"
# Tam ekran (tab bar yok) → "Ana Sayfaya Dön" ile home'a temiz dön (C için).
- tapOn:
    text: "Ana Sayfaya Dön"
- extendedWaitUntil:
    visible: "Kategoriler"
    timeout: 20000
