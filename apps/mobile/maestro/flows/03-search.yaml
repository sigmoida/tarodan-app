# Search smoke: Ara tab → arama listesi yüklenir, sonuç sayısı görünür.
# Detaylı filter testleri için ayrı flow'lar (testID gerektirir).
appId: com.tarodan.app
tags:
  - smoke
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Ara"
- extendedWaitUntil:
    visible:
      text: ".*sonuç bulundu.*"
    timeout: 30000
- assertVisible:
    text: ".*sonuç bulundu.*"
- assertNotVisible:
    text: ".*Network Error.*"
