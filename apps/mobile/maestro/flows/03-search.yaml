# Search smoke: Ara tab → arama listesi yüklenir, sonuç sayısı görünür.
# Detaylı filter testleri için ayrı flow'lar (testID gerektirir).
appId: host.exp.Exponent
---
- runFlow: ../subflows/open-tarodan.yaml
- tapOn:
    text: "Ara, tab.*"
- extendedWaitUntil:
    visible:
      text: ".*sonuç bulundu.*"
    timeout: 30000
- assertVisible:
    text: ".*sonuç bulundu.*"
- assertNotVisible:
    text: ".*Network Error.*"
