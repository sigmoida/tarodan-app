name: AI Moderation

# Self-contained pipeline for the Python AI moderation service
# (services/ai-moderation). Path-filtered so it ONLY runs when that service
# changes — it does not couple to the JS monorepo CI, and it does not rebuild
# the heavy (~2-3GB) image on unrelated pushes.
#
# Gating: the deploy jobs `needs: check`, so a failed lint/compile check blocks
# the deploy structurally (no branch-protection dependency required).
#   - push to development -> checks -> deploy moderation staging
#   - push to master      -> checks -> manual approval -> deploy moderation prod
#
# Required repo secrets (in addition to COOLIFY_URL / COOLIFY_TOKEN):
#   COOLIFY_MODERATION_STAGING_UUID -> staging app UUID
#   COOLIFY_MODERATION_PROD_UUID    -> production app UUID

on:
  push:
    branches: [development, master]
    paths:
      - 'services/ai-moderation/**'
      - '.github/workflows/moderation.yml'
      - '.github/actions/coolify-deploy/**'
  pull_request:
    branches: [development, master, main]
    paths:
      - 'services/ai-moderation/**'
      - '.github/workflows/moderation.yml'
      - '.github/actions/coolify-deploy/**'

concurrency:
  group: moderation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (lint + compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-moderation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      # Fail on syntax errors (compiles every .py in the service).
      - name: Syntax check
        run: python -m compileall -q .
      # Fail only on real errors (syntax, undefined names, f-string bugs) —
      # not on style. Keeps the gate fast and low-noise.
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .

  deploy-staging:
    name: Deploy staging
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Deploy moderation to Coolify (staging) and wait
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          uuids: ${{ secrets.COOLIFY_MODERATION_STAGING_UUID }}
      - name: Report failure
        if: failure()
        run: echo "::error::Moderation staging deploy failed — check the logs above."

  deploy-production:
    name: Deploy production
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The `production` environment has required reviewers => manual approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Deploy moderation to Coolify (production) and wait
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          uuids: ${{ secrets.COOLIFY_MODERATION_PROD_UUID }}
      - name: Report failure
        if: failure()
        run: echo "::error::Moderation production deploy failed — check the logs above."
