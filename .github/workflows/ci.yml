name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, master, main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run PayTR integration tests (real API calls)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_web_e2e:
        description: 'Run Playwright web e2e journeys (heavy — manual only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          prisma: 'false'
      - run: pnpm lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @tarodan/api test

  e2e-test:
    name: E2E Tests
    needs: [lint, type-check, build, unit-test]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarodan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'false'
      - run: pnpm --filter @tarodan/api test:e2e:setup
      - run: pnpm --filter @tarodan/api test:e2e

  web-e2e:
    name: Web E2E (Playwright)
    # Şimdilik SADECE elle: Actions → Run workflow → run_web_e2e=true. Otomatik (push/PR)
    # tetiklerde atlanır (ağır suite her commit'i yavaşlatmasın).
    if: ${{ github.event.inputs.run_web_e2e == 'true' }}
    needs: [lint, type-check, build, unit-test]
    runs-on: ubuntu-latest
    # 136 journey sıralı koşuyor (workers=1, retries=2) + trace/video arşivi → uzun sürebilir.
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarodan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Mail testleri (doğrulama/şifre e-postaları) için SMTP yakalayıcı.
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      # Playwright config'in webServer'a geçirdiği değerlerle aynı; CI servis portlarına işaret eder.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tarodan_test?schema=public
      MAILHOG_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'false'
      # Playwright tarayıcısı + OS bağımlılıkları (Chromium yeterli — config tek proje).
      - name: Install Playwright browser
        run: pnpm --filter @tarodan/web exec playwright install --with-deps chromium
      # Suite kendi webServer'larını (api :3001, web :3000) başlatır ve global-setup test DB'yi
      # sıfırlayıp seed'ler. CI=true olduğu için mevcut server'ı reuse etmez.
      - name: Run Playwright journeys
        run: pnpm --filter @tarodan/web test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Job-level env so the step-level `if` can read it (step env is not in
    # scope at if-evaluation time, but job env is).
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'false'
      - name: Run API tests with coverage
        run: pnpm --filter @tarodan/api test:cov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 14
      - name: Upload to Codecov (skipped if no token)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          prisma: 'false'
          turbo-cache: 'false'
      - name: Audit dependencies (critical fails)
        # Yalnızca critical açıklar CI'ı düşürür. Mevcut high'ların çoğu transitive
        # (NestJS/Apollo/expo/prisma) ve major upgrade gerektirir; risk almak yerine
        # critical gate'i koruyoruz. high'lar Dependabot üzerinden takip edilir.
        run: pnpm audit --audit-level=critical

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration-test:
    name: Integration Tests (PayTR Live API)
    if: github.event.inputs.run_integration == 'true'
    needs: [e2e-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: 'false'
      - run: pnpm --filter @tarodan/api test:integration
        env:
          PAYTR_MERCHANT_ID: ${{ secrets.PAYTR_MERCHANT_ID }}
          PAYTR_MERCHANT_KEY: ${{ secrets.PAYTR_MERCHANT_KEY }}
          PAYTR_MERCHANT_SALT: ${{ secrets.PAYTR_MERCHANT_SALT }}
