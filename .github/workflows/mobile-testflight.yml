name: Mobile Release (EAS Build + Submit — iOS & Android)

# Production mobile release. Triggered by a `mobile-v*` tag on master (e.g.
# `mobile-v1.3.0`). Builds iOS + Android via EAS and submits to TestFlight +
# Google Play internal track.
#
# Versioning: the marketing version lives in app.json (`expo.version`) as the
# reviewed source of truth; the release tag must MATCH it. CI verifies and fails
# on mismatch — it never overwrites a committed value. Bump app.json in the
# release PR, then tag to match. Build number / version code stay on EAS
# auto-increment via `appVersionSource: remote`.
#
# Triggers:
#   - push of a `mobile-v*` tag  -> production release (build + submit)
#   - workflow_dispatch          -> manual (choose profile + submit toggle)
#
# The job runs in the `production` GitHub Environment, so it passes through the
# same manual-approval gate as deploy-production.yml.
#
# Guard: if EXPO_TOKEN is missing the workflow is a silent no-op — safe to keep
# committed before the Apple/Google/EAS accounts are wired (see
# apps/mobile/SECRETS_SETUP.md).

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Submit to the stores after build?'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'mobile-v*'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS Build + Submit (iOS & Android)
    runs-on: ubuntu-latest
    # Manual-approval gate — same `production` environment as deploy-production.yml.
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not set — workflow is a no-op (see apps/mobile/SECRETS_SETUP.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup EAS CLI
        if: steps.guard.outputs.skip != 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve profile, submit flag, and version
        if: steps.guard.outputs.skip != 'true'
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ inputs.submit }}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            # tag push: refs/tags/mobile-v1.3.0 -> 1.3.0
            VERSION="${GITHUB_REF_NAME#mobile-v}"
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "submit=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing mobile version $VERSION from tag $GITHUB_REF_NAME"
          fi

      - name: Verify tag matches app.json version
        # The committed expo.version is the source of truth; the tag must match it.
        # Never overwrite a reviewed value from CI. No-op on manual dispatch.
        if: steps.guard.outputs.skip != 'true' && steps.resolve.outputs.version != ''
        working-directory: apps/mobile
        env:
          TAG_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag mobile-v$TAG_VERSION does not match app.json expo.version ($APP_VERSION). Bump app.json in a reviewed commit, then tag to match."
            exit 1
          fi
          echo "✓ tag matches app.json expo.version $APP_VERSION"

      - name: EAS build (iOS + Android, ${{ steps.resolve.outputs.profile }})
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/mobile
        run: |
          eas build \
            --platform all \
            --profile ${{ steps.resolve.outputs.profile }} \
            --non-interactive \
            --wait

      - name: EAS submit — iOS (TestFlight)
        if: steps.guard.outputs.skip != 'true' && steps.resolve.outputs.submit == 'true'
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive

      - name: EAS submit — Android (Play internal)
        if: steps.guard.outputs.skip != 'true' && steps.resolve.outputs.submit == 'true'
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform android \
            --profile production \
            --latest \
            --non-interactive
