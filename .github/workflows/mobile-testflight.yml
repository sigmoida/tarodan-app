name: Mobile TestFlight (EAS Build + Submit)

# EAS üzerinden iOS production build alır ve App Store Connect'e
# (TestFlight'a) gönderir. Apple/EAS credential'ları EAS sunucusunda
# tutulur; bu workflow yalnız EXPO_TOKEN'a ihtiyaç duyar.
#
# Tetikleyiciler:
#   - release/mobile-* branch'ine push (otomatik release akışı)
#   - workflow_dispatch (manuel; build profile + submit toggle ile)
#
# Guard: EXPO_TOKEN secret'ı yoksa workflow sessizce no-op biter.
# Bu, Apple/EAS hesapları kurulmadan önce repo'ya bu workflow'un
# güvenle commit'lenmesine izin verir.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      submit:
        description: 'Build sonrası TestFlight submit yapılsın mı?'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - 'release/mobile-*'

concurrency:
  group: mobile-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS Build + TestFlight Submit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN secret'ı yok — workflow no-op olarak biter (bkz. apps/mobile/SECRETS_SETUP.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup EAS CLI
        if: steps.guard.outputs.skip != 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve build profile
        if: steps.guard.outputs.skip != 'true'
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
            echo "submit=${{ inputs.submit }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS build (iOS, ${{ steps.profile.outputs.name }})
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/mobile
        run: |
          eas build \
            --platform ios \
            --profile ${{ steps.profile.outputs.name }} \
            --non-interactive \
            --no-wait

      - name: Wait for latest build to finish
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/mobile
        run: |
          eas build:list --platform ios --limit 1 --json --non-interactive > /tmp/eas-build.json
          BUILD_ID=$(jq -r '.[0].id' /tmp/eas-build.json)
          echo "Tracking build $BUILD_ID"
          eas build:view "$BUILD_ID" --non-interactive
          # poll
          while true; do
            STATUS=$(eas build:view "$BUILD_ID" --json --non-interactive | jq -r '.status')
            echo "status=$STATUS"
            case "$STATUS" in
              FINISHED) echo "✓ build finished"; break ;;
              ERRORED|CANCELED) echo "✗ build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done

      - name: EAS submit to TestFlight
        if: steps.guard.outputs.skip != 'true' && steps.profile.outputs.submit == 'true'
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive
