# FOLLOW-UP: feed the EAS preview .app into maestro-cloud.yml's app-file.
# Options: `eas build --local` to emit apps/mobile/build/*.app in-runner, or
# fetch the finished EAS artifact URL and download it before the maestro step.
name: Mobile Build

on:
  push:
    branches: [development]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [development, master, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  build:
    # Uses the `development` EAS profile because it builds an iOS *simulator*
    # .app (ios.simulator: true) with no Apple signing — exactly what Maestro
    # Cloud consumes. The `preview` profile is a signed real-device build.
    name: EAS Simulator Build (iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN missing — mobile build skipped (no-op)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          version: 8.12.0
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: 20
          cache: pnpm
      - uses: expo/expo-github-action@v8
        if: steps.guard.outputs.skip == 'false'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip == 'false'
      - name: EAS build (development profile, iOS simulator)
        if: steps.guard.outputs.skip == 'false'
        working-directory: apps/mobile
        run: eas build --profile development --platform ios --non-interactive --no-wait
