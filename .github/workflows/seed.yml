# =============================================================================
# TARODAN - Manuel Database Seed
# GitHub Actions sayfasından "Run workflow" ile tetiklenir.
# Sadece ilk deploy'da veya DB sıfırlandığında kullanılır.
# =============================================================================

name: Tarodan DB Seed

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "seed" to confirm database seeding'
        required: true
        default: ''

jobs:
  seed-database:
    name: Seed Database
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'seed'
    steps:
      - name: Seed database via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🌱 Running database seed..."

            CONTAINER="tarodan-api"

            # API container'ın çalıştığını kontrol et
            if ! docker ps | grep -q "$CONTAINER"; then
              echo "❌ API container is not running! Deploy first."
              exit 1
            fi

            # Seed komutunu çalıştır
            docker exec $CONTAINER npx prisma db seed --schema=prisma/schema.prisma

            echo "✅ Database seed completed!"
