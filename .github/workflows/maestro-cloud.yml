name: Maestro Cloud (Mobile e2e)

# Mobile UI flows are run on Maestro Cloud (real iOS simulators).
# Requires:
#   - secrets.MAESTRO_CLOUD_API_KEY:        Cloud dashboard > Settings > API Keys
#   - secrets.MAESTRO_CLOUD_PROJECT_ID:     Cloud dashboard > Project Settings > "Project ID"
#   - A built .app artifact for the mobile app (Expo dev build or release build)
#
# Until both secrets + .app artifact are wired up, this workflow exits cleanly
# via the guard step (see CLOUD_SETUP.md).

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/maestro-cloud.yml'
  pull_request:
    branches: [development, master, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/maestro-cloud.yml'

jobs:
  maestro:
    name: Maestro Cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip if secrets or .app artefact are missing
        id: guard
        run: |
          if [ -z "${{ secrets.MAESTRO_CLOUD_API_KEY }}" ] || [ -z "${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Maestro Cloud secrets eksik — workflow no-op olarak biter."
          elif [ ! -e apps/mobile/build/Tarodan.app ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile/build/Tarodan.app yok — üretim paketleme (EAS Build) tamamlandığında otomatik devreye girer. Bu commit için sessiz no-op."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-workspace
        if: steps.guard.outputs.skip == 'false'
        with:
          prisma: 'false'
          turbo-cache: 'false'

      # NOTE: Real run requires a built .app artifact (Expo Go custom build or
      # eas build --profile development --platform ios --local). The path below
      # is a placeholder until the build pipeline is configured.
      - name: Run flows on Maestro Cloud
        if: steps.guard.outputs.skip == 'false'
        uses: mobile-dev-inc/action-maestro-cloud@v3
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}
          app-file: apps/mobile/build/Tarodan.app
          workspace: apps/mobile/maestro
          # Smoke-only first: rapid iteration. Expand as flows stabilise.
          include-tags: smoke
