name: PR Checks

# PRs to development run Typecheck & lint + Unit tests (the full API suite
# included); development has no required checks, so the unit job is advisory. PRs to master — the development -> master release
# PR and hotfix/* PRs — run the FULL gate, adding the production build and the
# dependency audit. The jobs live in the reusable verify.yml.
#
# The master ruleset requires these check names (docs/OPERATIONS.md §4):
#   Verify / Typecheck & lint
#   Verify / Unit tests
#   Verify / Build & audit
# Do not rename the "Verify" job or the jobs in verify.yml without updating the
# ruleset, or master PRs will wait forever for a check that never reports.
# No path filters for the same reason: a required check must always run.

on:
  pull_request:
    branches: [development, master]
    # edited: switching a PR's base (development <-> master) must re-run the
    # gate at the new level. It also re-runs on title/body edits — cheap on a
    # public repo, and cancelling + restarting is harmless.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      full: ${{ github.base_ref == 'master' }}
