name: Deploy Production

# When CI (ci.yml) succeeds on the master branch, trigger the Coolify
# production applications (api/web/admin) via their deploy webhook.
# environment: production => the "Required reviewers" set under
# Settings > Environments > production make the deploy pass through a MANUAL
# APPROVAL gate.
#
# The "Auto Deploy" toggle for the production apps MUST be OFF in Coolify.
#
# NOTE: workflow_run-triggered workflows only run from the version on the
# repo's DEFAULT branch. This file must be merged into the default branch,
# otherwise it never triggers.
#
# Required repo secrets:
#   COOLIFY_URL          -> https://coolify.your-domain.com
#   COOLIFY_TOKEN        -> Coolify API token (deploy-capable)
#   COOLIFY_PROD_UUIDS   -> production app UUIDs, comma-separated: uuidApi,uuidWeb,uuidAdmin

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify (production)
    # Manual dispatch, or master CI finished GREEN.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The `production` environment has required reviewers => manual approval gate.
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Triggers the deploy AND waits for the result — a failed Coolify deploy
      # fails this job, so it shows up as a failed check + GitHub failure email.
      - name: Deploy to Coolify (production) and wait
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          uuids: ${{ secrets.COOLIFY_PROD_UUIDS }}
      - name: Report failure
        if: failure()
        run: echo "::error::Production deploy failed — check the logs above (Coolify deployment did not finish successfully)."
