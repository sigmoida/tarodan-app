name: Release Production

# Coolify Auto Deploy must be disabled for the production API, web and admin
# resources. A master push reaches Coolify only after this clean-runner gate.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Verify release
        run: pnpm verify:ci

      - id: affected
        name: Detect affected applications
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            apps="api,web,admin"
          else
            apps="$(node scripts/detect-affected-apps.mjs \
              --base "$BEFORE_SHA" \
              --head "$AFTER_SHA" \
              --format csv)"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Affected applications: ${apps:-none}"

      - name: Deploy affected production applications
        if: ${{ steps.affected.outputs.apps != '' }}
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          all-uuids: ${{ secrets.COOLIFY_PROD_UUIDS }}
          apps: ${{ steps.affected.outputs.apps }}
          wait-for-result: "true"

      - name: Skip deployment
        if: ${{ steps.affected.outputs.apps == '' }}
        run: echo "No deployable application changed."
