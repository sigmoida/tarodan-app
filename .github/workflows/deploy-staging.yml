name: Deploy Staging

# Coolify Auto Deploy must be disabled for the staging API, web and admin
# resources. This workflow is the only deployment trigger for development.
#
# development = staging, so the gate is the QUICK one (verify.yml, full:
# false): typecheck + lint + the full API unit suite + every vitest suite,
# ~4-5 min wall-clock with the jobs in parallel. A failing gate means nothing
# is deployed; fix forward or re-run the failed job. The production build is
# not part of it — Coolify builds the images anyway, and the full gate runs on
# the development -> master PR.
#
# A newer push cancels an older run that is still verifying or waiting on
# Coolify (concurrency below). The deploy job therefore diffs against the last
# SUCCESSFUL run, not against `github.event.before`, so a cancelled run's apps
# still ship (.github/actions/deploy-targets). A run counts as successful only
# after Coolify reports every build finished (wait-for-result), and it never
# triggers Coolify once development has moved past the verified commit
# (Coolify always builds the branch HEAD; see expected-commit).

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  verify:
    name: Staging gate
    uses: ./.github/workflows/verify.yml
    with:
      full: false

  deploy:
    name: Deploy affected staging apps
    needs: verify
    # A manual run from another branch would gate that branch's tree while
    # Coolify builds development: never deploy from anything but development.
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: affected
        name: Detect applications changed since the last successful deploy
        uses: ./.github/actions/deploy-targets
        with:
          workflow: deploy-staging.yml
          github-token: ${{ github.token }}

      - name: Trigger affected Coolify deployments
        if: ${{ steps.affected.outputs.apps != '' }}
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          all-uuids: ${{ secrets.COOLIFY_STAGING_UUIDS }}
          apps: ${{ steps.affected.outputs.apps }}
          expected-commit: ${{ github.sha }}
          branch: development
          # Wait for Coolify: a failed build must fail this run, or the next
          # run would diff against a commit that never reached staging.
          wait-for-result: "true"
          timeout-seconds: "900"

      - name: Skip deployment
        if: ${{ steps.affected.outputs.apps == '' }}
        run: echo "No deployable application changed."
