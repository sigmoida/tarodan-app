name: Deploy Staging

# When CI (ci.yml) succeeds on the development branch, trigger the Coolify
# staging applications (api/web/admin) via their deploy webhook.
# The "Auto Deploy" toggle for these apps MUST be OFF in Coolify — deploys are
# no longer triggered by push, only from here when CI is green.
#
# Only the apps whose files actually changed are redeployed (see the `changes`
# job): a commit touching just apps/api/** deploys api alone. Shared code
# (packages/**) or root manifests (package.json, lockfile, turbo/workspace
# config) fan out to all three, since every app consumes the shared packages.
# Merge commits and manual runs deploy all three (no clean single-parent diff).
#
# NOTE: workflow_run-triggered workflows only run from the version on the
# repo's DEFAULT branch. This file must be merged into the default branch,
# otherwise it never triggers.
#
# Required repo secrets:
#   COOLIFY_URL            -> https://coolify.your-domain.com
#   COOLIFY_TOKEN          -> Coolify API token (deploy-capable)
#   COOLIFY_STAGING_UUIDS  -> staging app UUIDs, comma-separated IN THIS ORDER:
#                             uuidApi,uuidWeb,uuidAdmin  (order matters — the
#                             `changes` job splits on it to pick per-app UUIDs)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development]
  # Manual trigger — deploy staging on demand (also used to test the Coolify
  # webhook in isolation without waiting for a development merge + CI run).
  # A manual run always deploys ALL three apps.
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  changes:
    name: Detect affected apps
    # Manual dispatch, or development CI finished GREEN. Failed/cancelled CI -> never triggers.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      uuids: ${{ steps.pick.outputs.uuids }}
    steps:
      - uses: actions/checkout@v7
        with:
          # For workflow_run, check out the exact commit CI validated (not the
          # branch tip, which may have moved) and fetch history so we can diff
          # the single pushed commit. fetch-depth 0 keeps HEAD~1 available.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - id: pick
        name: Pick UUIDs for the changed apps
        env:
          ALL_UUIDS: ${{ secrets.COOLIFY_STAGING_UUIDS }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # COOLIFY_STAGING_UUIDS is "api,web,admin" — order is load-bearing.
          IFS=',' read -r API_UUID WEB_UUID ADMIN_UUID _rest <<< "$ALL_UUIDS"
          all() { printf '%s,%s,%s' "$API_UUID" "$WEB_UUID" "$ADMIN_UUID"; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> deploy all three."
            sel="$(all)"
          elif [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            # >2 fields = merge commit (2+ parents); a single-parent diff would
            # miss the merged-in changes, so redeploy everything to be safe.
            echo "Merge commit -> deploy all three."
            sel="$(all)"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            # Shared code / root manifests affect every app.
            shared='^(packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$)'
            want_api=0; want_web=0; want_admin=0
            if echo "$changed" | grep -qE "$shared"; then
              want_api=1; want_web=1; want_admin=1
            fi
            echo "$changed" | grep -qE '^apps/api/'   && want_api=1   || true
            echo "$changed" | grep -qE '^apps/web/'   && want_web=1   || true
            echo "$changed" | grep -qE '^apps/admin/' && want_admin=1 || true

            list=""
            [ "$want_api" = 1 ]   && list="$list,$API_UUID"
            [ "$want_web" = 1 ]   && list="$list,$WEB_UUID"
            [ "$want_admin" = 1 ] && list="$list,$ADMIN_UUID"
            sel="${list#,}"
          fi

          echo "uuids=$sel" >> "$GITHUB_OUTPUT"
          if [ -z "$sel" ]; then
            echo "No deployable app changed — deploy job will be skipped."
          else
            echo "Deploying UUIDs: $sel"
          fi

  deploy:
    name: Trigger Coolify (staging)
    needs: changes
    # Skip entirely when nothing deployable changed (e.g. docs/CI-only commit).
    if: ${{ needs.changes.outputs.uuids != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # Triggers the deploy AND waits for the result — a failed Coolify deploy
      # fails this job, so it shows up as a failed check + GitHub failure email.
      - name: Deploy to Coolify (staging) and wait
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          uuids: ${{ needs.changes.outputs.uuids }}
      - name: Report failure
        if: failure()
        run: echo "::error::Staging deploy failed — check the logs above (Coolify deployment did not finish successfully)."
