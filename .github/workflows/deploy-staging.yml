name: Deploy Staging

# Coolify Auto Deploy must be disabled for the staging API, web and admin
# resources. This workflow is the only deployment trigger for development.

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy affected staging apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: affected
        name: Detect affected applications
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            apps="api,web,admin"
          else
            apps="$(node scripts/detect-affected-apps.mjs \
              --base "$BEFORE_SHA" \
              --head "$AFTER_SHA" \
              --format csv)"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Affected applications: ${apps:-none}"

      - name: Trigger affected Coolify deployments
        if: ${{ steps.affected.outputs.apps != '' }}
        uses: ./.github/actions/coolify-deploy
        with:
          coolify-url: ${{ secrets.COOLIFY_URL }}
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          all-uuids: ${{ secrets.COOLIFY_STAGING_UUIDS }}
          apps: ${{ steps.affected.outputs.apps }}
          wait-for-result: "false"

      - name: Skip deployment
        if: ${{ steps.affected.outputs.apps == '' }}
        run: echo "No deployable application changed."
