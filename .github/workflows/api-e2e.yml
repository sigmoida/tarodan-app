name: API E2E

# ADVISORY — not a required check (yet). Runs the API e2e suite and the full
# scenarios (`verify-local.mjs ci --group e2e`, the same stages as
# `pnpm verify:release:local`) against service containers that mirror
# docker-compose.yml on the ports apps/api/.env.test expects:
#   Postgres 16 (tarodan_test), Redis 7, Elasticsearch 8.17, Mailpit.
# No repository secrets: .env.test carries test-only values and every external
# provider (PayTR, Sürat, S3, eLogo) is mocked or stubbed in the e2e app.
#
# It has not been proven on a GitHub runner yet. Run it by hand (Actions ->
# API E2E -> Run workflow on development) and on a few master PRs; once it is
# reliably green, add "API e2e" to the master ruleset's required checks.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: API e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tarodan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: "false"

      - name: Migrate the test database, run API e2e and full scenarios
        run: node scripts/verify-local.mjs ci --group e2e
