# =============================================================================
# TARODAN - Otomatik Deployment (Master Branch)
# Master branch'e push yapıldığında otomatik olarak build edilir ve VPS'e deploy edilir
# =============================================================================

name: Tarodan Deploy

on:
  push:
    branches: ['master']

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # Infrastructure: PostgreSQL, Redis, MinIO, Elasticsearch, MailHog
  # =========================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Deploy infrastructure services via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🏗️ Deploying infrastructure services..."

            # Docker network oluştur (yoksa)
            docker network create tarodan-network 2>/dev/null || true

            # docker-compose.yml dosyasını oluştur
            mkdir -p /root/tarodan-infra
            cat > /root/tarodan-infra/docker-compose.yml << 'COMPOSE_EOF'
            version: '3.8'

            name: tarodan

            services:
              # PostgreSQL Database
              postgres:
                image: postgres:15-alpine
                container_name: tarodan-postgres
                environment:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgres
                  POSTGRES_DB: tarodan
                ports:
                  - "5432:5432"
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                networks:
                  - tarodan-network

              # Redis Cache
              redis:
                image: redis:7-alpine
                container_name: tarodan-redis
                ports:
                  - "6379:6379"
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                networks:
                  - tarodan-network

              # MinIO Object Storage
              minio:
                image: minio/minio:latest
                container_name: tarodan-minio
                command: server /data --console-address ":9001"
                environment:
                  MINIO_ROOT_USER: minioadmin
                  MINIO_ROOT_PASSWORD: minioadmin
                ports:
                  - "9000:9000"
                  - "9001:9001"
                volumes:
                  - minio_data:/data
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
                  interval: 30s
                  timeout: 20s
                  retries: 3
                networks:
                  - tarodan-network

              # Elasticsearch for Search
              elasticsearch:
                image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
                container_name: tarodan-elasticsearch
                environment:
                  - discovery.type=single-node
                  - xpack.security.enabled=false
                  - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
                ports:
                  - "9200:9200"
                volumes:
                  - elasticsearch_data:/usr/share/elasticsearch/data
                healthcheck:
                  test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
                  interval: 30s
                  timeout: 10s
                  retries: 5
                networks:
                  - tarodan-network

              # MailHog for Email Testing
              mailhog:
                image: mailhog/mailhog:latest
                container_name: tarodan-mailhog
                ports:
                  - "1025:1025"
                  - "8025:8025"
                networks:
                  - tarodan-network

            volumes:
              postgres_data:
              redis_data:
              minio_data:
              elasticsearch_data:

            networks:
              tarodan-network:
                external: true
            COMPOSE_EOF

            # Docker compose ile servisleri başlat
            cd /root/tarodan-infra
            docker compose up -d

            # Servislerin başlamasını bekle
            echo "⏳ Waiting for services to start..."
            sleep 10

            # Durum kontrolü
            echo "📋 Infrastructure status:"
            docker compose ps

            echo "✅ Infrastructure deployment complete!"

  # =========================================================================
  # Application Builds: API, Web, Admin
  # =========================================================================
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # API - NestJS Backend
          - app_name: api
            dockerfile: ./apps/api/Dockerfile
            port: 3001
            internal_port: 3001

          # Web - Next.js Public Web
          - app_name: web
            dockerfile: ./apps/web/Dockerfile
            port: 3000
            internal_port: 3000

          # Admin - Next.js Admin Panel
          - app_name: admin
            dockerfile: ./apps/admin/Dockerfile
            port: 3002
            internal_port: 3002

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase username
        id: username
        run: echo "username=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.username.outputs.username }}/tarodan-${{ matrix.app_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Değişkenler
            USERNAME_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="${{ env.REGISTRY }}/$USERNAME_LOWER/tarodan-${{ matrix.app_name }}:latest"
            CONTAINER="tarodan-${{ matrix.app_name }}"
            PORT="${{ matrix.port }}"
            INTERNAL_PORT="${{ matrix.internal_port }}"

            echo "🚀 Deploying ${{ matrix.app_name }} on port $PORT..."

            # GitHub Container Registry'ye login
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Docker network (infrastructure ile aynı network)
            docker network create tarodan-network 2>/dev/null || true

            # Eski container'ı durdur ve sil
            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true

            # Yeni image'ı çek
            docker pull $IMAGE

            # Environment file kontrolü ve container başlatma
            ENV_FILE="/root/tarodan-${{ matrix.app_name }}.env"
            if [ -f "$ENV_FILE" ]; then
              echo "📝 Using environment file: $ENV_FILE"
              docker run -d \
                --name $CONTAINER \
                --restart unless-stopped \
                --network tarodan-network \
                -p $PORT:$INTERNAL_PORT \
                --env-file $ENV_FILE \
                $IMAGE
            else
              echo "⚠️  Environment file not found: $ENV_FILE"
              echo "📝 Starting container without env file (you should create .env file on VPS)"
              docker run -d \
                --name $CONTAINER \
                --restart unless-stopped \
                --network tarodan-network \
                -p $PORT:$INTERNAL_PORT \
                $IMAGE
            fi

            # Kullanılmayan image'ları temizle
            docker image prune -f

            # Container'ın başladığını kontrol et
            echo "⏳ Waiting for container to start..."
            sleep 5

            # Container durumunu kontrol et
            if docker ps | grep -q "$CONTAINER"; then
              echo "✅ Container $CONTAINER is running"
              echo "📋 Container logs (last 20 lines):"
              docker logs --tail 20 $CONTAINER
            else
              echo "❌ Container $CONTAINER failed to start!"
              echo "📋 Container logs:"
              docker logs $CONTAINER 2>&1 || true
              exit 1
            fi

            echo "✅ ${{ matrix.app_name }} deployed successfully on port $PORT"
