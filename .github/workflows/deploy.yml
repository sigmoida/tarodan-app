# =============================================================================
# TARODAN - Otomatik Deployment (Master Branch)
# Master branch'e push yapıldığında otomatik olarak build edilir ve VPS'e deploy edilir
# =============================================================================

name: Tarodan Deploy

on:
  push:
    branches: ['master']

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # API - NestJS Backend
          - app_name: api
            dockerfile: ./apps/api/Dockerfile
            context: ./apps/api
            port: 3001
            internal_port: 3001

          # Web - Next.js Public Web
          - app_name: web
            dockerfile: ./apps/web/Dockerfile
            context: ./apps/web
            port: 3000
            internal_port: 3000

          # Admin - Next.js Admin Panel
          - app_name: admin
            dockerfile: ./apps/admin/Dockerfile
            context: ./apps/admin
            port: 3002
            internal_port: 3002

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase username
        id: username
        run: echo "username=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.username.outputs.username }}/tarodan-${{ matrix.app_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Değişkenler
            USERNAME_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="${{ env.REGISTRY }}/$USERNAME_LOWER/tarodan-${{ matrix.app_name }}:latest"
            CONTAINER="tarodan-${{ matrix.app_name }}"
            PORT="${{ matrix.port }}"
            INTERNAL_PORT="${{ matrix.internal_port }}"

            echo "🚀 Deploying ${{ matrix.app_name }} on port $PORT..."

            # GitHub Container Registry'ye login
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Eski container'ı durdur ve sil
            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true

            # Yeni image'ı çek
            docker pull $IMAGE

            # Environment file kontrolü ve container başlatma
            ENV_FILE="/root/tarodan-${{ matrix.app_name }}.env"
            if [ -f "$ENV_FILE" ]; then
              echo "📝 Using environment file: $ENV_FILE"
              docker run -d \
                --name $CONTAINER \
                --restart unless-stopped \
                -p $PORT:$INTERNAL_PORT \
                --env-file $ENV_FILE \
                $IMAGE
            else
              echo "⚠️  Environment file not found: $ENV_FILE"
              echo "📝 Starting container without env file (you should create .env file on VPS)"
              docker run -d \
                --name $CONTAINER \
                --restart unless-stopped \
                -p $PORT:$INTERNAL_PORT \
                $IMAGE
            fi

            # Kullanılmayan image'ları temizle
            docker image prune -f

            echo "✅ ${{ matrix.app_name }} deployed successfully on port $PORT"
