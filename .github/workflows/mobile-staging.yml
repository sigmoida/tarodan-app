name: Mobile Staging (OTA + Preview Build)

# The mobile mirror of deploy-staging.yml. On every push to `development` that
# touches the mobile app it ships to the staging channel the fast way:
#   - JS / asset-only change  -> `eas update --branch staging` (OTA, ~1 min)
#   - native change           -> full `preview` EAS build (iOS+Android) to
#                                internal distribution, built against staging-api
#
# "Native change" = anything baked into the binary: a dependency change
# (package.json / lockfile), app.json / app.config.js / eas.json, ios/·android/,
# config plugins, google-services.json. Everything else ships over the air.
#
# Scheduled + manual runs always do a full preview build (a periodic fresh
# internal build; a manual run can force either mode).
#
# Guard: a no-op if EXPO_TOKEN is missing — safe to keep committed before the
# EAS account is wired (see apps/mobile/SECRETS_SETUP.md and docs/EAS_UPDATE_OTA.md).
#
# NOTE: push-triggered workflows run from the branch that was pushed, so this
# must be merged into `development` to start firing.

on:
  push:
    branches: [development]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-staging.yml'
  schedule:
    - cron: '0 3 * * 1' # weekly Mon 03:00 UTC — fresh internal preview build
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to ship to staging'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - ota

concurrency:
  group: mobile-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify change (native → build, JS → OTA)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Guard — skip if EXPO_TOKEN missing
        id: guard
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN missing — mobile-staging is a no-op (see apps/mobile/SECRETS_SETUP.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          # Full history so we can diff the pushed commit (HEAD~1..HEAD).
          fetch-depth: 0

      - id: decide
        name: Decide OTA vs full build
        if: steps.guard.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Any of these paths -> the binary changed -> full build, not OTA.
          native_re='^(apps/mobile/(package\.json|app\.json|app\.config\.js|eas\.json|google-services\.json)$|apps/mobile/(ios|android|plugins|patches)/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> ${DISPATCH_MODE}"
            echo "mode=${DISPATCH_MODE}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo "Scheduled -> full preview build."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            # Merge commit (2+ parents): a single-parent diff would miss merged
            # changes, so do a full build to be safe (mirror deploy-staging.yml).
            echo "Merge commit -> full preview build (safe)."
            echo "mode=build" >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --name-only HEAD~1 HEAD)"
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            if echo "$changed" | grep -qE "$native_re"; then
              echo "Native-affecting change -> full preview build."
              echo "mode=build" >> "$GITHUB_OUTPUT"
            else
              echo "JS/asset-only change -> OTA update."
              echo "mode=ota" >> "$GITHUB_OUTPUT"
            fi
          fi

  ota:
    name: OTA update → staging channel
    needs: classify
    if: needs.classify.outputs.skip != 'true' && needs.classify.outputs.mode == 'ota'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          prisma: 'false'
          turbo-cache: 'false'
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA to staging
        working-directory: apps/mobile
        # Message via env (never inline ${{ }} in run:) so a commit message can't
        # break out of the shell.
        env:
          MSG: ${{ github.event.head_commit.message || 'manual staging OTA' }}
        run: |
          eas update \
            --branch staging \
            --message "$MSG" \
            --non-interactive

  build:
    name: Preview build (iOS+Android) → internal, staging-api
    needs: classify
    if: needs.classify.outputs.skip != 'true' && needs.classify.outputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          prisma: 'false'
          turbo-cache: 'false'
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS preview build (internal distribution, staging-api)
        working-directory: apps/mobile
        # --no-wait: don't block the runner ~20 min; the build finishes on EAS.
        run: |
          eas build \
            --platform all \
            --profile preview \
            --non-interactive \
            --no-wait
