name: 'Coolify Deploy'
description: >-
  Trigger a Coolify deploy for one or more apps (comma-separated UUIDs), with an
  optional wait for the deployment result.

inputs:
  coolify-url:
    description: 'Base URL of the Coolify instance (e.g. https://coolify.example.com)'
    required: true
  coolify-token:
    description: 'Coolify API token (deploy-capable)'
    required: true
  uuids:
    description: 'Comma-separated app UUIDs to deploy (used when apps/all-uuids are not given)'
    required: false
    default: ''
  all-uuids:
    description: >-
      Full comma-separated UUID list in api,web,admin order (usually the
      COOLIFY_*_UUIDS secret). Combined with `apps`, the action selects the
      subset to deploy — so the secret flows as an action INPUT and never as a
      job/step OUTPUT (GitHub redacts secret-valued outputs, which silently
      empties them and skips the deploy).
    required: false
    default: ''
  apps:
    description: 'Comma-separated app names (api/web/admin) to deploy; mapped against all-uuids.'
    required: false
    default: ''
  timeout-seconds:
    description: 'Max seconds to wait per deployment before giving up'
    required: false
    default: '1200'
  poll-interval:
    description: 'Seconds between status polls'
    required: false
    default: '10'
  wait-for-result:
    description: 'Whether to poll Coolify until every deployment finishes'
    required: false
    default: 'true'
  retry-failed-deployments:
    description: 'Number of times to retry a failed deployment with a forced rebuild'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    - name: Trigger Coolify deploy
      shell: bash
      env:
        COOLIFY_URL: ${{ inputs.coolify-url }}
        COOLIFY_TOKEN: ${{ inputs.coolify-token }}
        UUIDS: ${{ inputs.uuids }}
        ALL_UUIDS: ${{ inputs.all-uuids }}
        APPS: ${{ inputs.apps }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        WAIT_FOR_RESULT: ${{ inputs.wait-for-result }}
        RETRY_FAILED_DEPLOYMENTS: ${{ inputs.retry-failed-deployments }}
      run: |
        set -euo pipefail

        print_deployment_diagnostics() {
          local details_file="$1"
          echo "----- Coolify deployment details -----"
          if jq -e . "$details_file" >/dev/null 2>&1; then
            jq '{
              deployment_uuid,
              application_name,
              status,
              commit,
              commit_message,
              created_at,
              updated_at,
              deployment_url
            }' "$details_file"
          else
            echo "No valid deployment details returned."
          fi
          echo "----- Coolify deployment log tail -----"
          if jq -e . "$details_file" >/dev/null 2>&1; then
            jq -r '.logs // "No deployment logs returned. The Coolify token may need read:sensitive permission."' \
              "$details_file" | tail -n 200
          else
            echo "No deployment logs returned."
          fi
          echo "----------------------------------------"
        }

        trigger_deploy() {
          local resource_uuids="$1"
          local force_rebuild="$2"
          local response_file http_code response_body
          response_file="$(mktemp)"
          if ! http_code="$(curl -sS --retry 3 --retry-delay 10 --retry-all-errors \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -o "$response_file" -w '%{http_code}' \
              "$COOLIFY_URL/api/v1/deploy?uuid=$resource_uuids&force=$force_rebuild")"; then
            echo "::error::Could not reach the Coolify deploy API." >&2
            cat "$response_file" >&2 || true
            unlink "$response_file" || true
            return 1
          fi
          echo "Coolify deploy trigger -> HTTP $http_code" >&2
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Coolify deploy trigger returned HTTP $http_code" >&2
            echo "----- response body -----" >&2
            cat "$response_file" >&2 || true
            echo >&2
            echo "-------------------------" >&2
            unlink "$response_file" || true
            return 1
          fi
          response_body="$(cat "$response_file")"
          unlink "$response_file" || true
          printf '%s\n' "$response_body"
        }

        wait_for_deployment() {
          local deployment_uuid="$1"
          local max_polls="$2"
          local details_file http_code status
          details_file="$(mktemp)"

          for i in $(seq 1 "$max_polls"); do
            if ! http_code="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -o "$details_file" -w '%{http_code}' \
              "$COOLIFY_URL/api/v1/deployments/$deployment_uuid")"; then
              echo "::warning::Could not read deployment $deployment_uuid on poll $i; retrying."
              sleep "$POLL_INTERVAL"
              continue
            fi
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::warning::Deployment status request for $deployment_uuid returned HTTP $http_code on poll $i; retrying."
              sleep "$POLL_INTERVAL"
              continue
            fi

            status="$(jq -r '.status // "unknown"' "$details_file")"
            echo "[$i/$max_polls] $deployment_uuid -> $status"
            case "$status" in
              finished|success)
                echo "✓ $deployment_uuid succeeded"
                unlink "$details_file" || true
                return 0
                ;;
              failed|error|cancelled*|failed*)
                echo "::error::deployment $deployment_uuid ended: $status"
                print_deployment_diagnostics "$details_file"
                unlink "$details_file" || true
                return 1
                ;;
            esac
            sleep "$POLL_INTERVAL"
          done

          echo "::error::deployment $deployment_uuid did not finish within ${TIMEOUT_SECONDS}s"
          print_deployment_diagnostics "$details_file"
          unlink "$details_file" || true
          return 1
        }

        # Resolve the effective UUIDs. Preferred path: map app NAMES (apps) to a
        # subset of ALL_UUIDS here, inside the action, because ALL_UUIDS is a
        # secret — a secret routed through a job/step OUTPUT is redacted by
        # GitHub and comes back empty (which was silently skipping deploys).
        # As an action INPUT it is safe.
        if [ -n "${APPS:-}" ] && [ -n "${ALL_UUIDS:-}" ]; then
          # api,web,admin order is load-bearing.
          IFS=',' read -r API_UUID WEB_UUID ADMIN_UUID _rest <<< "$ALL_UUIDS"
          sel=""
          _old_ifs="$IFS"; IFS=','
          for a in $APPS; do
            a="$(printf '%s' "$a" | tr -d '[:space:]')"
            case "$a" in
              api)   u="$API_UUID" ;;
              web)   u="$WEB_UUID" ;;
              admin) u="$ADMIN_UUID" ;;
              '')    u="" ;;
              *)     u=""; echo "::warning::unknown app name '$a' — skipped" ;;
            esac
            [ -n "$u" ] && sel="$sel,$u"
          done
          IFS="$_old_ifs"
          UUIDS="${sel#,}"
        fi
        if [ -z "${UUIDS:-}" ]; then
          echo "::error::No UUIDs to deploy — pass 'uuids', or 'apps' + 'all-uuids'."
          exit 1
        fi
        if ! [[ "$TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] ||
          ! [[ "$POLL_INTERVAL" =~ ^[1-9][0-9]*$ ]] ||
          ! [[ "$RETRY_FAILED_DEPLOYMENTS" =~ ^[0-9]+$ ]]; then
          echo "::error::timeout-seconds and poll-interval must be positive integers; retry-failed-deployments must be a non-negative integer."
          exit 1
        fi

        echo "Triggering Coolify deploy for: $UUIDS"
        # Capture the HTTP status AND body separately (no -f) so a non-2xx from
        # Coolify surfaces the actual message instead of a bare "curl: (22) 403".
        # A 401 = bad/expired token; 403 = token authenticated but lacks the
        # deploy scope or belongs to a different team than the app UUIDs; an HTML
        # body usually means a WAF/Cloudflare in front of Coolify blocked us.
        if ! resp="$(trigger_deploy "$UUIDS" false)"; then
          exit 1
        fi
        echo "$resp" | jq .

        # Keep the resource/deployment pair so a transient failure can be
        # retried for only that application instead of redeploying all apps.
        DEPLOYMENTS=()
        while IFS= read -r deployment; do
          DEPLOYMENTS+=("$deployment")
        done < <(
          echo "$resp" | jq -r '.deployments[] | [.resource_uuid, .deployment_uuid] | @tsv'
        )
        if [ "${#DEPLOYMENTS[@]}" -eq 0 ]; then
          echo "::error::No deployment_uuid returned — deploy was not queued."
          exit 1
        fi

        if [ "$WAIT_FOR_RESULT" != "true" ]; then
          echo "Queued ${#DEPLOYMENTS[@]} Coolify deployment(s); result polling disabled."
          exit 0
        fi

        max_polls=$(( TIMEOUT_SECONDS / POLL_INTERVAL ))
        if [ "$max_polls" -lt 1 ]; then
          max_polls=1
        fi
        fail=0
        for deployment in "${DEPLOYMENTS[@]}"; do
          IFS=$'\t' read -r resource_uuid deployment_uuid <<< "$deployment"
          du="$deployment_uuid"
          echo "::group::Waiting for deployment $du"
          if ! wait_for_deployment "$du" "$max_polls"; then
            succeeded=0
            for retry in $(seq 1 "$RETRY_FAILED_DEPLOYMENTS"); do
              echo "::warning::Retrying failed deployment for resource $resource_uuid ($retry/$RETRY_FAILED_DEPLOYMENTS) with force=true."
              if ! retry_resp="$(trigger_deploy "$resource_uuid" true)"; then
                continue
              fi
              echo "$retry_resp" | jq .
              retry_du="$(echo "$retry_resp" | jq -r '.deployments[0].deployment_uuid // empty')"
              if [ -z "$retry_du" ]; then
                echo "::error::Retry did not return a deployment_uuid for resource $resource_uuid."
                continue
              fi
              if wait_for_deployment "$retry_du" "$max_polls"; then
                succeeded=1
                break
              fi
            done
            if [ "$succeeded" -ne 1 ]; then
              fail=1
            fi
          fi
          echo "::endgroup::"
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::One or more Coolify deployments failed."
          exit 1
        fi
        echo "All deployments finished successfully."
