name: 'Setup Workspace'
description: >-
  Shared CI bootstrap: pnpm + node (single source of truth), optional Turbo
  cache, dependency install and optional prisma generate. Removes duplication.
  Note: checkout must run BEFORE this action in the job (a local action only
  resolves once the repo is checked out).

inputs:
  prisma:
    description: 'Whether to run prisma generate (with retry)'
    required: false
    default: 'true'
  turbo-cache:
    description: 'Whether to restore/save the turbo task cache (off for the full master gate)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # pnpm version is not pinned -> read from the "packageManager" field in package.json (single source).
    - uses: pnpm/action-setup@v4

    # Node version is read from .nvmrc (single source).
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # turbo 1.x keeps its local cache in node_modules/.cache/turbo (NOT .turbo,
    # which this step used to cache — every run was a full miss). Restored
    # after the install so pnpm starts from an empty node_modules.
    - name: Cache Turbo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: node_modules/.cache/turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-

    - uses: ./.github/actions/prisma-generate
      if: inputs.prisma == 'true'
