version: 2
updates:
  # npm — ONE grouped PR per week for ALL minor/patch bumps (prod + dev together).
  # Major upgrades are ignored: they are breaking (typescript, prisma, @nestjs/*,
  # eslint, jest, tailwindcss, next, …) and are done deliberately by hand, not via
  # Dependabot. This keeps the weekly npm noise to a single, always-green PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  # github-actions — ONE grouped PR per week for all action bumps.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns:
          - "*"
