version: '3.8'

services:
  # Traefik Reverse Proxy & Load Balancer
  traefik:
    image: traefik:v2.10
    container_name: tarodan-traefik
    restart: unless-stopped
    command:
      # API Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=tarodan-network"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Let's Encrypt SSL
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      # Metrics for Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - traefik_logs:/var/log/traefik
    networks:
      - tarodan-network
    labels:
      # Dashboard
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH}"
      # Global rate limiting middleware
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1m"
      # Strict rate limiting for auth endpoints
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=10"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=5"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=1m"
      # Security headers middleware
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      # Compression middleware
      - "traefik.http.middlewares.compress.compress=true"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tarodan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup:/backup
    networks:
      - tarodan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Adminer — canlı DB görüntüleyici (tarayıcıdan: https://db.${DOMAIN})
  # İKİ KATMAN koruma: (1) Traefik basic-auth (ADMINER_AUTH) gate'i, (2) Adminer'ın
  # kendi login formunda DB kullanıcı/şifresi. Postgres internet'e AÇILMAZ; Adminer
  # ona yalnız iç ağdan (postgres:5432) erişir. DB creds compose'da TUTULMAZ — login'de girilir.
  adminer:
    image: adminer:4
    container_name: tarodan-adminer
    restart: unless-stopped
    environment:
      # Login formunda "Server" alanını önceden doldurur (PostgreSQL container adı).
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tarodan-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.${DOMAIN}`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.adminer.middlewares=adminer-auth,security-headers,rate-limit"
      - "traefik.http.middlewares.adminer-auth.basicauth.users=${ADMINER_AUTH}"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: tarodan-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - tarodan-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: tarodan-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.name=tarodan-cluster
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - tarodan-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # API Server (Replicas: 2)
  api:
    image: ${REGISTRY:-ghcr.io/sigmoida}/tarodan-api:${IMAGE_TAG:-latest}
    container_name: tarodan-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Bound Prisma's pool per process so 2 API replicas + worker stay well
      # under Postgres max_connections (#71). Raise these (or front with
      # PgBouncer) if max_connections / replica count is tuned up.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?connection_limit=20&pool_timeout=20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENV_PREFIX: ${S3_ENV_PREFIX:-prod}
      # Public Google OAuth client IDs — safe to commit; default avoids needing a server-side .env edit.
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB:-243308404313-kdc77bd36flfhv6ujlb5tfd4qjteh94c.apps.googleusercontent.com}
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID}
      # Sürat Kargo (değerler Coolify env'inden gelir; güvenli varsayılanlar).
      # Test için Coolify'da: SURAT_CARGO_ENABLED=true, SURAT_SOAP_MODE=rest,
      # SURAT_KARGO_TEST_MODE=true, SURAT_KARGO_CARI_KODU=..., SURAT_KARGO_SIFRE=...
      SURAT_CARGO_ENABLED: ${SURAT_CARGO_ENABLED:-false}
      SURAT_SOAP_MODE: ${SURAT_SOAP_MODE:-stub}
      SURAT_KARGO_TEST_MODE: ${SURAT_KARGO_TEST_MODE:-true}
      SURAT_KARGO_CARI_KODU: ${SURAT_KARGO_CARI_KODU}
      SURAT_KARGO_SIFRE: ${SURAT_KARGO_SIFRE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - tarodan-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=rate-limit,security-headers,compress"
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      - "traefik.http.services.api.loadbalancer.healthCheck.path=/api/health/ready"
      - "traefik.http.services.api.loadbalancer.healthCheck.interval=10s"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Background Worker (Replicas: 2)
  worker:
    image: ${REGISTRY:-ghcr.io/sigmoida}/tarodan-api:${IMAGE_TAG:-latest}
    container_name: tarodan-worker
    restart: unless-stopped
    command: node dist/worker.js
    environment:
      NODE_ENV: production
      # Bound Prisma's pool per process so 2 API replicas + worker stay well
      # under Postgres max_connections (#71). Raise these (or front with
      # PgBouncer) if max_connections / replica count is tuned up.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?connection_limit=20&pool_timeout=20
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENV_PREFIX: ${S3_ENV_PREFIX:-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tarodan-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Web Frontend (Replicas: 2)
  web:
    image: ${REGISTRY:-ghcr.io/sigmoida}/tarodan-web:${IMAGE_TAG:-latest}
    container_name: tarodan-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://api.${DOMAIN}
    networks:
      - tarodan-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=rate-limit,security-headers,compress"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      # www to non-www redirect
      - "traefik.http.routers.web-www.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.web-www.entrypoints=websecure"
      - "traefik.http.routers.web-www.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Admin Frontend (Replicas: 1)
  admin:
    image: ${REGISTRY:-ghcr.io/sigmoida}/tarodan-admin:${IMAGE_TAG:-latest}
    container_name: tarodan-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    networks:
      - tarodan-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=rate-limit,security-headers,compress"
      - "traefik.http.services.admin.loadbalancer.server.port=3002"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tarodan-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    networks:
      - tarodan-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: tarodan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - tarodan-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=security-headers"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Loki Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: tarodan-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - tarodan-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Promtail Log Shipper
  promtail:
    image: grafana/promtail:latest
    container_name: tarodan-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tarodan-network

volumes:
  traefik_letsencrypt:
  traefik_logs:
  postgres_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  tarodan-network:
    name: tarodan-network
    driver: bridge
